<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가족달력</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#fffaf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족달력">
<style>
:root{
  --bg:#fffaf2;--card:#fff;--ink:#26313b;--muted:#8b949d;--line:#ece6dc;
  --sun:#df4a4a;--sat:#3979c6;--today:#fff1cc;--shadow:0 8px 28px rgba(40,40,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:14px 10px 34px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.titleWrap{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:#fff;box-shadow:var(--shadow);padding:5px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;align-items:center;gap:6px}
button{font:inherit}
.iconBtn,.todayBtn,.addBtn{border:0;background:#fff;box-shadow:var(--shadow);border-radius:13px;height:40px;min-width:40px;padding:0 12px;color:var(--ink);font-weight:700}
.monthBar{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 10px}
.monthTitle{font-size:24px;font-weight:850;letter-spacing:-.5px;min-width:135px;text-align:center}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 1px 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800;opacity:.45}
.filter.active{opacity:1;box-shadow:0 4px 12px rgba(40,40,40,.06)}
.legendDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.calendar{background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #f1ece4}
.weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays{border-bottom:1px solid var(--line);background:#fffdf9}
.weekday{text-align:center;padding:10px 2px;font-size:12px;font-weight:850}
.weekday.sun{color:var(--sun)} .weekday.sat{color:var(--sat)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px 6px;position:relative;background:#fff}
.day:nth-child(7n){border-right:0}
.day.other{background:#fcfaf7;color:#b9b9b9}
.day.today{background:var(--today)}
.dayHead{display:flex;align-items:flex-start;justify-content:space-between;min-height:23px;gap:3px}
.dateNum{font-size:13px;font-weight:850;line-height:1}
.day.sun .dateNum,.day.holiday .dateNum{color:var(--sun)}
.day.sat .dateNum{color:var(--sat)}
.badge{font-size:9px;border-radius:999px;padding:2px 5px;background:#ffe1e1;color:#c63b3b;font-weight:850;white-space:nowrap}
.holidayName{font-size:9px;color:var(--sun);font-weight:750;line-height:1.1;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.events{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.event{border:0;width:100%;text-align:left;background:#f7f7f7;border-radius:7px;padding:4px 5px;font-size:10px;line-height:1.25;color:var(--ink);overflow:hidden}
.owner{font-weight:900;margin-right:3px}
.more{font-size:9px;color:var(--muted);font-weight:750;padding:1px 4px}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:9px;min-height:17px}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:22px;border:0;border-radius:50%;width:56px;height:56px;font-size:28px;background:#f29b5c;color:white;box-shadow:0 10px 25px rgba(0,0,0,.18)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;justify-content:center;z-index:20}
.backdrop.show{display:flex}
.sheet{width:min(760px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px rgba(0,0,0,.12)}
.sheet h2{margin:0 0 14px;font-size:20px}
.row{display:flex;gap:8px}.field{margin:10px 0}
label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
input,select{width:100%;height:46px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font:inherit;background:#fff}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;height:48px;border-radius:14px;border:0;font-weight:850}
.cancel{background:#f1f1f1}.save{background:#f29b5c;color:#fff}.delete{background:#fff0f0;color:#c63b3b}
.notice{padding:10px 12px;border-radius:12px;background:#fff6e9;color:#795c35;font-size:12px;margin-bottom:10px;display:none}
@media(max-width:520px){
 .app{padding:10px 6px 28px}
 .day{min-height:92px;padding:4px 2px}
 .event{font-size:9.5px;padding:3px 4px}
 .monthTitle{font-size:22px}
 .top{align-items:flex-start}
 .sub{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="titleWrap">
      <img class="logo" src="./icon.svg" alt="">
      <div><h1>가족달력</h1><div class="sub">우리 가족 한달 일정판</div></div>
    </div>
    <div class="nav"><button class="todayBtn" id="todayBtn">오늘</button></div>
  </div>

  <div class="monthBar">
    <button class="iconBtn" id="prevBtn" aria-label="이전 달">‹</button>
    <div class="monthTitle" id="monthTitle"></div>
    <button class="iconBtn" id="nextBtn" aria-label="다음 달">›</button>
  </div>

  <div class="filters" id="filters"></div>

  <div class="calendar">
    <div class="weekdays">
      <div class="weekday sun">일</div><div class="weekday">월</div><div class="weekday">화</div>
      <div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div>
      <div class="weekday sat">토</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="sync" id="sync">불러오는 중…</div>
</div>

<button class="fab" id="fab" aria-label="일정 추가">＋</button>

<div class="backdrop" id="backdrop">
  <div class="sheet">
    <div class="notice" id="notice"></div>
    <h2 id="sheetTitle">일정 추가</h2>
    <div class="field"><label>날짜</label><input type="date" id="dateInput"></div>
    <div class="field"><label>누구 일정인가요?</label>
      <select id="ownerInput">
        <option>가족</option><option>아빠</option><option>엄마</option><option>현준</option><option>현아</option>
      </select>
    </div>
    <div class="field"><label>내용</label><input id="textInput" maxlength="40" placeholder="예: 현준 모의고사"></div>
    <div class="actions">
      <button class="cancel" id="cancelBtn">취소</button>
      <button class="save" id="saveBtn">저장</button>
    </div>
    <div class="actions" id="deleteRow" style="display:none">
      <button class="delete" id="deleteBtn">이 일정 삭제</button>
    </div>
  </div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbx4XSEaZ7QViMeruF4MzbXPCg8ekE8KJa8CqqyOlm2-3mFC6Q3fXah3ny85u-D6uubp/exec';
const OWNERS=['가족','아빠','엄마','현준','현아'];
const OWNER_COLOR={'가족':'#7b8794','아빠':'#f3b76c','엄마':'#db8aa1','현준':'#7db4dc','현아':'#8bc59c'};
let view=new Date(); view.setDate(1);
let events=[], holidays={}, active=new Set(OWNERS), editingId=null, apiReady=false;

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>key(new Date());

function jsonp(params, timeout=8000){
  return new Promise((resolve,reject)=>{
    const cb='fc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('timeout'));},timeout);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}
    window[cb]=data=>{cleanup();resolve(data);};
    const q=new URLSearchParams({...params,callback:cb,_:Date.now()});
    s.src=API_URL+'?'+q.toString();
    s.onerror=()=>{cleanup();reject(new Error('network'));};
    document.body.appendChild(s);
  });
}

async function load(){
  $('#sync').textContent='동기화 중…';
  try{
    const y=view.getFullYear(), m=view.getMonth()+1;
    const data=await jsonp({action:'calendarState',year:y,month:m});
    if(!data || !data.ok) throw new Error(data&&data.message||'API');
    events=data.events||[]; holidays=data.holidays||{}; apiReady=true;
    $('#sync').textContent='가족과 공유 중 · 방금 동기화';
  }catch(e){
    apiReady=false; events=[]; holidays={};
    $('#sync').textContent='공유 연결 준비 중';
  }
  render();
}

function renderFilters(){
  const box=$('#filters'); box.innerHTML='';
  OWNERS.forEach(o=>{
    const b=document.createElement('button'); b.className='filter'+(active.has(o)?' active':'');
    b.innerHTML='<span class="legendDot" style="background:'+OWNER_COLOR[o]+'"></span>'+o;
    b.onclick=()=>{active.has(o)?active.delete(o):active.add(o);renderFilters();render();};
    box.appendChild(b);
  });
}

function offDay(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  return d.getDay()===0||d.getDay()===6||!!holidays[dateStr];
}
function longWeekend(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  for(let start=-2;start<=0;start++){
    let ok=true;
    for(let i=0;i<3;i++){const x=new Date(d);x.setDate(x.getDate()+start+i);if(!offDay(key(x))){ok=false;break;}}
    if(ok)return true;
  }
  return false;
}
function render(){
  $('#monthTitle').textContent=view.getFullYear()+'년 '+(view.getMonth()+1)+'월';
  const grid=$('#grid');grid.innerHTML='';
  const first=new Date(view.getFullYear(),view.getMonth(),1);
  const start=new Date(first);start.setDate(start.getDate()-first.getDay());
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const ds=key(d), inMonth=d.getMonth()===view.getMonth(), dow=d.getDay();
    const cell=document.createElement('div');
    cell.className='day'+(!inMonth?' other':'')+(dow===0?' sun':'')+(dow===6?' sat':'')+(ds===todayKey()?' today':'')+(holidays[ds]?' holiday':'');
    const dayEvents=events.filter(e=>e.date===ds&&active.has(e.owner));
    const holiday=holidays[ds]||'';
    cell.innerHTML='<div class="dayHead"><span class="dateNum">'+d.getDate()+'</span>'+(longWeekend(ds)&&inMonth?'<span class="badge">연휴</span>':'')+'</div>'
      +(holiday?'<div class="holidayName" title="'+esc(holiday)+'">'+esc(holiday)+'</div>':'')
      +'<div class="events"></div>';
    const evBox=cell.querySelector('.events');
    dayEvents.slice(0,3).forEach(e=>{
      const b=document.createElement('button');b.className='event';
      b.innerHTML='<span class="owner" style="color:'+OWNER_COLOR[e.owner]+'">'+esc(e.owner)+'</span>'+esc(e.text);
      b.onclick=ev=>{ev.stopPropagation();openEdit(e);};evBox.appendChild(b);
    });
    if(dayEvents.length>3){const more=document.createElement('div');more.className='more';more.textContent='+'+(dayEvents.length-3)+'개';evBox.appendChild(more);}
    cell.onclick=()=>openAdd(ds);
    grid.appendChild(cell);
  }
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openAdd(ds=todayKey()){editingId=null;$('#sheetTitle').textContent='일정 추가';$('#dateInput').value=ds;$('#ownerInput').value='가족';$('#textInput').value='';$('#deleteRow').style.display='none';showSheet();}
function openEdit(e){editingId=e.id;$('#sheetTitle').textContent='일정 수정';$('#dateInput').value=e.date;$('#ownerInput').value=e.owner;$('#textInput').value=e.text;$('#deleteRow').style.display='flex';showSheet();}
function showSheet(){hideNotice();$('#backdrop').classList.add('show');setTimeout(()=>$('#textInput').focus(),120);}
function closeSheet(){$('#backdrop').classList.remove('show');editingId=null;}
function notice(t){const n=$('#notice');n.textContent=t;n.style.display='block';}
function hideNotice(){$('#notice').style.display='none';}

async function save(){
  const date=$('#dateInput').value, owner=$('#ownerInput').value, text=$('#textInput').value.trim();
  if(!date||!text){notice('날짜와 내용을 입력해 주세요.');return;}
  if(!apiReady){notice('공유 연결이 아직 준비되지 않았습니다.');return;}
  $('#saveBtn').disabled=true;$('#saveBtn').textContent='저장 중…';
  try{
    const data=await jsonp({action:editingId?'calendarUpdate':'calendarAdd',id:editingId||'',date,owner,text});
    if(!data.ok)throw new Error(data.message||'저장 실패');
    closeSheet();await load();
  }catch(e){notice('저장하지 못했습니다. 다시 시도해 주세요.');}
  finally{$('#saveBtn').disabled=false;$('#saveBtn').textContent='저장';}
}
async function del(){
  if(!editingId||!confirm('이 일정을 삭제할까요?'))return;
  try{const data=await jsonp({action:'calendarDelete',id:editingId});if(!data.ok)throw new Error();closeSheet();await load();}
  catch(e){notice('삭제하지 못했습니다.');}
}

$('#prevBtn').onclick=()=>{view.setMonth(view.getMonth()-1);load();};
$('#nextBtn').onclick=()=>{view.setMonth(view.getMonth()+1);load();};
$('#todayBtn').onclick=()=>{view=new Date();view.setDate(1);load();};
$('#fab').onclick=()=>openAdd();
$('#cancelBtn').onclick=closeSheet;$('#saveBtn').onclick=save;$('#deleteBtn').onclick=del;
$('#backdrop').onclick=e=>{if(e.target===$('#backdrop'))closeSheet();};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
setInterval(()=>{if(!document.hidden)load();},15000);
renderFilters();load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script>
</body>
</html>
