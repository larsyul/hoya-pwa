<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>가족달력</title>
<link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="icon" href="./icon.svg?v=4" type="image/svg+xml">
<meta name="theme-color" content="#fffaf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족달력">
<style>
:root{--bg:#fffaf2;--ink:#26313b;--muted:#8b949d;--line:#ece6dc;--sun:#df4a4a;--sat:#3979c6;--today:#fff1cc;--shadow:0 8px 28px rgba(40,40,40,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:12px 8px 34px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;background:#fff;padding:5px;box-shadow:var(--shadow)}h1{font-size:23px;margin:0}.todayBtn,.navBtn{border:0;background:#fff;box-shadow:var(--shadow);border-radius:13px;height:42px;padding:0 13px;font-weight:800;color:var(--ink)}
.monthBar{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}.monthTitle{min-width:145px;text-align:center;font-size:25px;font-weight:900}.filters{display:flex;gap:7px;overflow:auto;padding:2px 1px 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;opacity:.4}.filter.active{opacity:1}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.calendar{background:#fff;border:1px solid #f1ece4;border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{border-bottom:1px solid var(--line)}.wd{text-align:center;padding:10px 2px;font-size:12px;font-weight:900}.wd.sun{color:var(--sun)}.wd.sat{color:var(--sat)}.day{min-height:102px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px;background:#fff}.day:nth-child(7n){border-right:0}.day.other{background:#fcfaf7;color:#bbb}.day.today{background:var(--today)}.head{display:flex;justify-content:space-between;gap:3px;min-height:22px}.num{font-size:13px;font-weight:900}.day.sun .num,.day.holiday .num{color:var(--sun)}.day.sat .num{color:var(--sat)}.holidayName{font-size:9px;color:var(--sun);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:9px;background:#ffe1e1;color:#c63b3b;border-radius:999px;padding:2px 5px;font-weight:900}.events{display:flex;flex-direction:column;gap:3px;margin-top:4px}.event{border:0;width:100%;text-align:left;background:#f7f7f7;border-radius:7px;padding:4px 5px;font-size:10px;line-height:1.25;color:var(--ink)}.owner{font-weight:900;margin-right:3px}.more{font-size:9px;color:var(--muted);font-weight:800}.sync{text-align:center;font-size:11px;color:var(--muted);margin-top:9px;min-height:18px}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#f39a57;color:#fff;font-size:30px;box-shadow:0 10px 25px rgba(0,0,0,.2)}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center;z-index:20}.backdrop.show{display:flex}.sheet{width:min(760px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.field{margin:10px 0}label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}input,select{width:100%;height:46px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font:inherit;background:#fff}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;height:48px;border:0;border-radius:14px;font-weight:900}.cancel{background:#f1f1f1}.save{background:#f39a57;color:#fff}.delete{background:#fff0f0;color:#c63b3b}.notice{display:none;background:#fff6e9;color:#795c35;border-radius:12px;padding:10px 12px;font-size:12px;margin-bottom:10px}
@media(max-width:520px){.day{min-height:92px;padding:4px 2px}.event{font-size:9.5px;padding:3px 4px}.monthTitle{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><img class="logo" src="./icon.svg?v=4" alt=""><h1>가족달력</h1></div><button class="todayBtn" id="todayBtn">오늘</button></div>
  <div class="monthBar"><button class="navBtn" id="prevBtn">‹</button><div class="monthTitle" id="monthTitle"></div><button class="navBtn" id="nextBtn">›</button></div>
  <div class="filters" id="filters"></div>
  <div class="calendar"><div class="week"><div class="wd sun">일</div><div class="wd">월</div><div class="wd">화</div><div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd sat">토</div></div><div class="grid" id="grid"></div></div>
  <div class="sync" id="sync">연결 확인 중…</div>
</div>
<button class="fab" id="fab">＋</button>
<div class="backdrop" id="backdrop"><div class="sheet"><div class="notice" id="notice"></div><h2 id="sheetTitle">일정 추가</h2><div class="field"><label>날짜</label><input type="date" id="dateInput"></div><div class="field"><label>누구 일정인가요?</label><select id="ownerInput"><option>가족</option><option>아빠</option><option>엄마</option><option>현준</option><option>현아</option></select></div><div class="field"><label>내용</label><input id="textInput" maxlength="40" placeholder="예: 현준 모의고사"></div><div class="actions"><button class="cancel" id="cancelBtn">취소</button><button class="save" id="saveBtn">저장</button></div><div class="actions" id="deleteRow" style="display:none"><button class="delete" id="deleteBtn">이 일정 삭제</button></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbx4XSEaZ7QViMeruF4MzbXPCg8ekE8KJa8CqqyOlm2-3mFC6Q3fXah3ny85u-D6uubp/exec';
const OWNERS=['가족','아빠','엄마','현준','현아'];
const COLORS={'가족':'#7b8794','아빠':'#f3b76c','엄마':'#db8aa1','현준':'#7db4dc','현아':'#8bc59c'};
let view=new Date();view.setDate(1);let events=[],holidays={},active=new Set(OWNERS),editingId=null,apiReady=false;
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),todayKey=()=>key(new Date());
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsonp(params,timeout=9000){return new Promise((resolve,reject)=>{const cb='fc_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(new Error('응답 시간 초과'));},timeout);function cleanup(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});s.onerror=()=>{cleanup();reject(new Error('네트워크 또는 접근 권한 오류'))};document.body.appendChild(s)})}
async function load(){apiReady=false;$('#sync').textContent='연결 확인 중…';try{const ping=await jsonp({action:'ping'},7000);if(!ping||!ping.ok)throw new Error((ping&&ping.message)||'API 연결 실패');const data=await jsonp({action:'calendarState',year:view.getFullYear(),month:view.getMonth()+1},12000);if(!data||!data.ok)throw new Error((data&&data.message)||'일정 불러오기 실패');events=data.events||[];holidays=data.holidays||{};apiReady=true;$('#sync').textContent='가족과 공유 중 · 방금 동기화'}catch(e){events=[];holidays={};$('#sync').textContent='연결 오류 · '+(e?.message||'알 수 없는 오류')}render()}
function renderFilters(){const box=$('#filters');box.innerHTML='';OWNERS.forEach(o=>{const b=document.createElement('button');b.className='filter'+(active.has(o)?' active':'');b.innerHTML='<span class="dot" style="background:'+COLORS[o]+'"></span>'+o;b.onclick=()=>{active.has(o)?active.delete(o):active.add(o);renderFilters();render()};box.appendChild(b)})}
function off(ds){const d=new Date(ds+'T12:00:00');return d.getDay()===0||d.getDay()===6||!!holidays[ds]}
function longWeekend(ds){const d=new Date(ds+'T12:00:00');for(let st=-2;st<=0;st++){let ok=true;for(let i=0;i<3;i++){const x=new Date(d);x.setDate(x.getDate()+st+i);if(!off(key(x))){ok=false;break}}if(ok)return true}return false}
function render(){monthTitle.textContent=view.getFullYear()+'년 '+(view.getMonth()+1)+'월';grid.innerHTML='';const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(start.getDate()-first.getDay());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=key(d),dow=d.getDay(),inMonth=d.getMonth()===view.getMonth(),h=holidays[ds]||'',list=events.filter(e=>e.date===ds&&active.has(e.owner));const cell=document.createElement('div');cell.className='day'+(!inMonth?' other':'')+(dow===0?' sun':'')+(dow===6?' sat':'')+(ds===todayKey()?' today':'')+(h?' holiday':'');cell.innerHTML='<div class="head"><span class="num">'+d.getDate()+'</span>'+(longWeekend(ds)&&inMonth?'<span class="badge">연휴</span>':'')+'</div>'+(h?'<div class="holidayName">'+esc(h)+'</div>':'')+'<div class="events"></div>';const eb=cell.querySelector('.events');list.slice(0,3).forEach(e=>{const b=document.createElement('button');b.className='event';b.innerHTML='<span class="owner" style="color:'+COLORS[e.owner]+'">'+esc(e.owner)+'</span>'+esc(e.text);b.onclick=x=>{x.stopPropagation();openEdit(e)};eb.appendChild(b)});if(list.length>3){const m=document.createElement('div');m.className='more';m.textContent='+'+(list.length-3)+'개';eb.appendChild(m)}cell.onclick=()=>openAdd(ds);grid.appendChild(cell)}}
function show(){notice.style.display='none';backdrop.classList.add('show');setTimeout(()=>textInput.focus(),100)}function closeSheet(){backdrop.classList.remove('show');editingId=null}function openAdd(ds=todayKey()){editingId=null;sheetTitle.textContent='일정 추가';dateInput.value=ds;ownerInput.value='가족';textInput.value='';deleteRow.style.display='none';show()}function openEdit(e){editingId=e.id;sheetTitle.textContent='일정 수정';dateInput.value=e.date;ownerInput.value=e.owner;textInput.value=e.text;deleteRow.style.display='flex';show()}function warn(t){notice.textContent=t;notice.style.display='block'}
async function save(){const date=dateInput.value,owner=ownerInput.value,text=textInput.value.trim();if(!date||!text)return warn('날짜와 내용을 입력해 주세요.');if(!apiReady)return warn('공유 연결이 아직 준비되지 않았습니다.');saveBtn.disabled=true;saveBtn.textContent='저장 중…';try{const d=await jsonp({action:editingId?'calendarUpdate':'calendarAdd',id:editingId||'',date,owner,text});if(!d.ok)throw new Error(d.message||'저장 실패');closeSheet();await load()}catch(e){warn('저장 오류 · '+(e?.message||''))}finally{saveBtn.disabled=false;saveBtn.textContent='저장'}}
async function del(){if(!editingId||!confirm('이 일정을 삭제할까요?'))return;try{const d=await jsonp({action:'calendarDelete',id:editingId});if(!d.ok)throw new Error(d.message||'삭제 실패');closeSheet();await load()}catch(e){warn('삭제 오류 · '+(e?.message||''))}}
prevBtn.onclick=()=>{view.setMonth(view.getMonth()-1);load()};nextBtn.onclick=()=>{view.setMonth(view.getMonth()+1);load()};todayBtn.onclick=()=>{view=new Date();view.setDate(1);load()};fab.onclick=()=>openAdd();cancelBtn.onclick=closeSheet;saveBtn.onclick=save;deleteBtn.onclick=del;backdrop.onclick=e=>{if(e.target===backdrop)closeSheet()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},15000);renderFilters();load();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js?v=4');
</script>
</body>
</html>
